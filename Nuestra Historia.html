  return (
    <footer style={{ padding: '32px 56px', background: '#06142E', color: '#7B8AA8', fontSize: 13, textAlign: 'center' }}>
      <div style={{ marginBottom: 10 }}>{lang === 'es' ? 'Aguascalientes, México · Cobertura en planta: Bajío, Norte y Centro del país' : 'Aguascalientes, Mexico · On-site coverage: Bajío, Northern and Central Mexico'}</div>
      <div>© 2026 IxT-QMS. {lang === 'es' ? 'Todos los derechos reservados' : 'All rights reserved'}. <a href="Aviso de Privacidad.html" style={{ color: '#9FB4D6' }}>{lang === 'es' ? 'Aviso de privacidad' : 'Privacy notice'}</a></div>
    </footer>
  );
}

function App() {
  const [lang, setLang] = React.useState(() => {
    const n = (navigator.languages && navigator.languages[0]) || navigator.language || 'es';
    return /^es/i.test(n) ? 'es' : 'en';
  });
  return (
    <div style={{ background: 'white' }}>
      <Nav lang={lang} setLang={setLang}/>
      <Hero lang={lang}/>
      <StatStrip lang={lang}/>
      <Achievement lang={lang}/>
      <Timeline lang={lang}/>
      <Certifications lang={lang}/>
      <WhyThisMatters lang={lang}/>
      <ServicesLink lang={lang}/>
      <CTA lang={lang}/>
      <Footer lang={lang}/>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
setTimeout(() => {
  let seen = false;
  try { seen = sessionStorage.getItem('ixSeenPerfil') === '1'; sessionStorage.setItem('ixSeenPerfil', '1'); } catch (e) {}
  if (seen || location.hash) return;
  const root = document.getElementById('root'), targets = [];
  const isGrid = (el) => /grid/.test(getComputedStyle(el).display);
  root.querySelectorAll('section').forEach((sec) => {
    const dark = /rgb\(1?[0-9], ?[0-9]/.test(getComputedStyle(sec).backgroundColor);
    const inner = sec.firstElementChild; if (!inner) return;
    Array.from(inner.children).forEach((ch) => {
      if (isGrid(ch) && ch.children.length > 1) {
        Array.from(ch.children).forEach((c, i) => {
          c.classList.add('ixr', 'ixh'); if (dark) c.classList.add('ixdark');
          c.style.transitionDelay = Math.min(i, 6) * 90 + 'ms';
          targets.push(c);
        });
      } else { ch.classList.add('ixr'); targets.push(ch); }
    });
  });
  const obs = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('on'); obs.unobserve(e.target); } }), { threshold: 0.06, rootMargin: '0px 0px -6% 0px' });
  targets.forEach((t) => obs.observe(t));
}, 60);
</script>
