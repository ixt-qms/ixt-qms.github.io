ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
setTimeout(()=>{
  let seen=false;
  try{seen=sessionStorage.getItem('ixSeenLanz')==='1';sessionStorage.setItem('ixSeenLanz','1');}catch(e){}
  if(seen||location.hash) return;
  const root=document.getElementById('root'),targets=[];
  root.querySelectorAll('section').forEach((sec)=>{
    const inner=sec.firstElementChild; if(!inner) return;
    Array.from(inner.children).forEach((ch)=>{
      if(/grid/.test(getComputedStyle(ch).display)&&ch.children.length>1){
        Array.from(ch.children).forEach((c,i)=>{c.classList.add('ixr','ixh');c.style.transitionDelay=Math.min(i,6)*90+'ms';targets.push(c);});
      } else {ch.classList.add('ixr');targets.push(ch);}
    });
  });
  const obs=new IntersectionObserver((es)=>es.forEach((e)=>{if(e.isIntersecting){e.target.classList.add('on');obs.unobserve(e.target);}}),{threshold:0.06,rootMargin:'0px 0px -6% 0px'});
  targets.forEach((x)=>obs.observe(x));
},60);
</script>
