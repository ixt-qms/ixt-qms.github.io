, y la instrucción practicada en 4 pasos."},"208":{"t":"Solución de Problemas 8D","o":"Resolver una queja del cliente con el método 8D: contener, encontrar y confirmar la causa raíz, corregir y evitar que se repita.","m":["El método: 8D y QC-Story","D0 a D2: preparar, equipo y describir","D3: contención","D4: causa raíz","D5 y D6: acciones y validación","D7 y D8: prevenir y cerrar"],"b":"Quejas cerradas a tiempo y con evidencia, menos problemas que regresan y una mejor calificación ante el cliente.","e":"Un 8D completo de un caso, de la D0 a la D8, y una lista de verificación para evaluar los 8D de su planta."},"209":{"t":"Método Taguchi: procesos robustos","o":"Diseñar y analizar experimentos con arreglos ortogonales y relación señal-ruido, para que un proceso dé el mismo resultado aunque cambien el clima, el material o el desgaste.","m":["Antecedentes y robustez","Función, ruido y control","Relación señal-ruido","Arreglos ortogonales","Las 5 fases y los 9 pasos","El experimento L18 del helicóptero","Características dinámicas","La catapulta y el tiro al blanco"],"b":"Procesos que producen bien a la primera y con menos ajustes, menos desperdicio por variación y mejoras logradas sin invertir en equipo nuevo.","e":"Dos experimentos completos hechos por los participantes y el plan de un experimento para un proceso de su planta."},"210":{"t":"Entrenador en Piso: método de 3 pasos","o":"Preparar e impartir un entrenamiento en el puesto con el método de 3 pasos (explicar, demostrar y verificar) y liberar al operador con criterios claros.","m":["El entrenador en piso","Preparar el entrenamiento","Paso 1: explicar","Paso 2: demostrar y que lo haga","Paso 3: verificar y dar seguimiento","Liberar y certificar"],"b":"Operadores nuevos productivos desde la primera semana, menos defectos causados por personal nuevo y entrenamientos iguales sin importar quién los imparta.","e":"Un plan de entrenamiento, una operación enseñada en 3 pasos y la evaluación del entrenador con criterios obligatorios."},"211":{"t":"5S: un puesto donde lo anormal se ve","o":"Aplicar las 5S en un puesto real: clasificar, ordenar, limpiar, estandarizar y sostener con auditorías.","m":["Por qué 5S","Clasificar","Ordenar","Limpiar","Estandarizar","Sostener y evaluar"],"b":"Menos tiempo perdido en buscar, errores y riesgos de seguridad visibles a simple vista, y áreas listas para la visita del cliente.","e":"El estado de referencia de un puesto, su evaluación con 12 criterios y una lista de auditoría con seguimiento de hallazgos."},"212":{"t":"TPM: equipos que no fallan por descuido","o":"Calcular el OEE con sus 6 grandes pérdidas y arrancar el automantenimiento, del paso 0 al 3, en un equipo real.","m":["Qué es TPM","OEE y las 6 grandes pérdidas","Automantenimiento: los 7 pasos","Pasos 0 y 1: conocer y limpiar","Paso 2: atacar el origen","Paso 3: el estándar","Evaluar el avance por paso"],"b":"Menos paros por descuido, operadores que detectan las fallas antes de que ocurran y un mantenimiento enfocado en lo que realmente le corresponde.","e":"El OEE con sus 6 pérdidas, un registro de anomalías, un estándar de automantenimiento y la evaluación del paso alcanzado."},"213":{"t":"FAST: del help call a la causa raíz","o":"Responder a los problemas en dos ciclos: en minutos en la línea, con la llamada de ayuda, y cada día en la junta, con el método Find, Act, Solve, Track.","m":["Por qué responder rápido","F · Find: detectar y llamar","A · Act: contener en 24 h","S · Solve: la causa con hechos","T · Track: la junta diaria","El reporte FAST de una hoja","Evaluar el sistema"],"b":"Problemas contenidos en horas y no en días, menos defectos que llegan al cliente y una junta diaria que sí cierra problemas.","e":"Los criterios para la llamada de ayuda, un plan de contención, el reporte FAST de una hoja y una junta diaria con sus indicadores."},"214":{"t":"Observación de Operaciones: la realidad frente al estándar","o":"Planear y realizar observaciones de operaciones para comprobar que se trabaja como indica el estándar, y convertir cada diferencia en una mejora con el operador.","m":["Por qué observar","Planear: el programa","Las 6 fases y la preparación","De lejos y con cronómetro","De cerca: puntos clave y piezas","Mejorar y cerrar con el operador","Seguimiento y coaching"],"b":"Estándares que se cumplen en la práctica, desviaciones detectadas antes de que causen defectos y supervisores que entrenan en el piso.","e":"Un programa mensual de observaciones, la hoja de observación de 6 pasos, un plan de acción y la evaluación para el coaching."},"301":{"t":"Tiempo Estándar y Productividad: medir para decidir","o":"Medir el trabajo con cronómetro, calcular el tiempo estándar y usarlo para decidir el takt, la capacidad, el personal y los indicadores.","m":["Productividad: qué medimos y para qué","El tiempo estándar: qué es y cómo se forma","El estudio de tiempos con cronómetro","Leer la variación: lo cíclico y lo que no","Takt, eficiencia y capacidad","Cálculo de personal","Indicadores y tablero de productividad"],"b":"Plantillas calculadas con datos y no por costumbre, capacidad real conocida antes de aceptar un pedido y horas perdidas visibles en el tablero.","e":"Un estudio de tiempos completo, el cálculo de personal y la cascada de horas de su área."},"302":{"t":"Valor Agregado: del proceso completo al movimiento","o":"Distinguir lo que agrega valor de lo que no en todo el flujo: en el proceso, en la operación, en el equipo, en el espacio y en la logística.","m":["Qué es valor agregado","Ver el desperdicio: el recorrido","Visión de águila: el proceso completo","Visión de insecto: la operación con lupa","Valor agregado del equipo y del espacio","Valor agregado en la logística","Del desperdicio a la mejora: dueños y prioridades"],"b":"Menor tiempo de entrega, menos costo oculto en transportes, esperas y movimientos, y una lista de mejoras con responsable.","e":"El tiempo de entrega (lead time) de un flujo, el porcentaje de valor agregado de una operación y la lista de desperdicios con responsable."},"303":{"t":"Mejora de Procesos y Balanceo de Líneas","o":"Eliminar el desperdicio del proceso y de la estación, y balancear la línea al takt respetando las precedencias, con varios modelos y volúmenes.","m":["Mejorar el proceso: ECRS","De islas a celdas en U","Economía de movimientos","Caminado y ciclo hombre-máquina","El material hacia la línea","Balanceo: los números","Precedencias y peso posicional","Principios de distribución","Varios modelos y volúmenes","Implementar y sostener"],"b":"El mismo volumen con menos operadores, líneas que cumplen el takt y una configuración lista para cada cambio de demanda.","e":"Un balanceo con precedencias y principios de distribución, el escenario para cada volumen y el plan de implementación."},"304":{"t":"Flujo y Producción Sincronizada (JIT)","o":"Pasar de producir por lotes a producir en flujo: jalar con kanban, sincronizar el abasto, dibujar el mapa de flujo de valor y reducir los cambios de modelo.","m":["Por qué JIT","Ver con ojos de flujo","Lote contra flujo","Tensar el proceso: práctica de campo","Jalar: kanban","Abasto cíclico y sincronización","Mapa de flujo de valor","Cambios rápidos y lotes chicos"],"b":"Menos inventario y menos días de tiempo de entrega, defectos detectados en la siguiente pieza y no en el siguiente lote, y más flexibilidad para cambiar de modelo.","e":"Un lazo de kanban calculado, el mapa de flujo de valor actual y futuro, y un cambio de modelo reducido."},"305":{"t":"Blitz Kaizen: mejora de una estación en 2 días","o":"Dirigir un evento de mejora de dos días en una estación crítica: preparar, medir, analizar, cambiar, probar, reportar y sostener el resultado.","m":["Qué es kaizen","El método Blitz Kaizen","Encontrar el desperdicio","Analizar la situación actual","Proponer contramedidas","Probar, medir y ajustar","Resultados y reporte","Sostener la mejora"],"b":"Resultados medibles en una estación crítica en solo dos días, con poca o ninguna inversión, y mejoras que se sostienen con estándar y seguimiento.","e":"Un Blitz Kaizen completo con su reporte de una hoja, el plan de seguimiento a 30, 60 y 90 días y el calendario para preparar el siguiente evento."},"01":{"t":"Metas y Gestión del Tiempo","o":"Fijar metas medibles, desplegarlas en tareas con responsable y fecha, y proteger en la agenda el tiempo que esas metas necesitan.","m":["Metas que sí se cumplen: cascada, prioridad y SMART","De la meta al resultado: tareas, obstáculos y dueños","¿A dónde se va mi tiempo? Gasta-tiempos y multitarea","Prioridades y agenda: decir que no y delegar"],"b":"Metas del área que avanzan cada semana, menos urgencias de última hora y supervisores que dedican su tiempo a lo que mueve los indicadores.","e":"Metas en cascada con su plan y su responsable, y una agenda semanal con bloques de tiempo protegidos."},"02":{"t":"Juntas de Alto Impacto","o":"Preparar y presentar un mensaje claro, responder preguntas difíciles y dirigir juntas que terminen con acuerdos, responsables y fechas.","m":["Prepara tu mensaje: objetivo, audiencia y slides claros","Preséntalo con impacto: voz, historias y preguntas","Juntas que sí sirven: propósito, formatos y roles","Dirige la junta: reglas, conductas difíciles y minuta"],"b":"Juntas más cortas y con decisiones, menos temas que regresan cada semana y presentaciones que la dirección entiende a la primera.","e":"Un mensaje resumido en una frase, diapositivas que se entienden sin explicación y una minuta con qué, quién y cuándo."},"03":{"t":"Feedback y Manejo de Conflictos","o":"Dar y recibir retroalimentación con un modelo estructurado, reconocer el propio estilo ante el conflicto y mediar hasta llegar a un acuerdo con plan.","m":["Dar feedback: el modelo SCI y escenas de piso","Recibir y pedir feedback, también hacia arriba","Entender el conflicto: percepciones, intereses y tu estilo","Resolver y crear valor: mediar y acordar un plan"],"b":"Problemas de desempeño atendidos a tiempo, menos conflictos que detienen la línea y un ambiente de trabajo que retiene a la gente buena.","e":"Una retroalimentación preparada con situación, comportamiento e impacto; su estilo ante el conflicto y un plan de cambio acordado."},"04":{"t":"Equipos de Alto Desempeño","o":"Definir los indicadores que importan, leer el tablero para actuar a tiempo y desarrollar a cada persona del equipo con instrucción, coaching y delegación.","m":["Mide lo que importa: del objetivo a la métrica","Lee el tablero y actúa: señal, ruido y trampas","Enseña el trabajo: matriz de habilidades e instrucción","Haz crecer a tu equipo: estilos, coaching y delegación"],"b":"Brechas detectadas antes de que se conviertan en problemas, personal capaz de cubrir varios puestos y un equipo que depende menos del supervisor.","e":"Un tablero con indicadores útiles, una matriz de habilidades, una instrucción de trabajo y un plan de desarrollo con el modelo GROW."},"05":{"t":"Decisiones de Alto Impacto","o":"Encontrar la causa real de un problema, generar alternativas y elegir con criterios ponderados, de forma individual o en equipo.","m":["Encuentra la causa: 5 porqués e Ishikawa","Abre las opciones: de 2 ideas a 30","Elige con método: criterios, matriz y trampas","Decide en equipo, comunica y revisa"],"b":"Decisiones que resuelven el problema a la primera, menos acuerdos que se rehacen y decisiones que se pueden explicar y defender ante la dirección.","e":"Una ruta de decisión de cinco pasos, una matriz de ponderación y una decisión comunicada, con fecha para revisar si funcionó."},"06":{"t":"Proyectos de Mejora: Justificación y Despliegue","o":"Elegir la mejora de mayor impacto, justificarla con un análisis financiero, obtener la aprobación de la dirección y desplegarla con resultados medibles.","m":["Encuentra la mejora que vale la pena","Entiende el proceso","Prioriza y aprende de quien lo hace mejor","Justifícala con números","Consigue el sí","El comité de inversión","Arma el proyecto","Despliega y demuestra"],"b":"Inversiones aprobadas con argumentos sólidos, proyectos que se terminan a tiempo y beneficios verificados, no solo estimados.","e":"Una propuesta de una página con el retorno de la inversión y un escenario conservador; el acta, el Gantt y el control de cambios del proyecto; el beneficio verificado."},"07":{"t":"Profesional de Alto Valor","o":"Actuar con integridad ante dilemas reales, alzar la voz con respeto, medir la satisfacción del cliente interno y construir un plan de carrera.","m":["Dilemas en planta","Alza la voz","Conoce a tu cliente","La lealtad del cliente, con números","Conócete","Tu siguiente paso","Tus relaciones","Tu plan"],"b":"Menos riesgos éticos y de calidad ocultos, mejor servicio entre áreas y talento que crece dentro de la empresa en lugar de irse.","e":"Un método para resolver dilemas, un guion para alzar la voz, una encuesta de satisfacción del cliente interno y un plan de carrera a 18 meses."}};
const DET_EN={"101":{"t":"GD&T Fundamentals · ASME Y14.5-2018","o":"Read and interpret any feature control frame, calculate virtual condition and bonus tolerance, and understand the datums of a real part.","m":["Why GD&T","Symbols and the feature control frame","Size, MMC/LMC and Rule #1","Virtual condition and bonus","Form I: flatness and straightness","Form II: circularity and cylindricity","Datums and the datum reference frame","Datum targets and selection"],"b":"Fewer parts rejected or accepted because of a misread drawing, fewer disputes with customers and suppliers, and measurements that verify what the design actually requires.","e":"Correct reading of the feature control frames on a real drawing, with the 2018 edition changes identified."},"102":{"t":"GD&T Advanced · ASME Y14.5-2018","o":"Calculate and interpret position, profile and runout tolerances, including datum shift and composite patterns.","m":["Datum features of size","Datum shift","Orientation","Position I: fundamentals and calculation","Position II: applications and fasteners","Composite position and patterns","Runout, concentricity and symmetry","Profile"],"b":"Drawings reviewed before release, fewer assembly problems at launch and lower cost from tolerances tighter than needed.","e":"Position calculations with bonus, the fastener formula applied and the review of a drawing before release."},"201":{"t":"New Model Launch: from the Program to Safe Launch","o":"Organize the people, documents, packaging, work, training and equipment for a new model, and protect the customer during ramp-up.","m":["The new model program","Project team and leader","Process standardization","Packaging design","Work allocation and balancing","Training and certification","Equipment, facilities and pilot runs","Safe Launch and problem response"],"b":"On-time ramp-ups with fewer defects, problems caught in pilot runs instead of at the customer, and a shorter start-up curve.","e":"The program with its events, the packaging design, the work allocation, the training plan and a Safe Launch plan."},"202":{"t":"Process Readiness Assessment","o":"Assess with data whether each area is ready for the next launch event, and build recovery plans for whatever is not.","m":["What it is and when to assess","Building the item list","Scoring and verifying","Recovery plan"],"b":"Launch risks visible weeks in advance, start-up decisions based on data and fewer surprises on start of production day.","e":"A list of items to assess with targets by event, the score of each area and its recovery plans."},"203":{"t":"4M and Engineering Change Management","o":"Classify, evaluate, approve and implement changes in manpower, machine, material, method and engineering, with breakpoint and verification.","m":["Why changes must be controlled","Types of change","The planned change step by step","Unplanned changes","Task force and final confirmation","Application on the floor"],"b":"No change without notifying the customer, traceability for every modification and fewer defects from uncontrolled changes.","e":"A change procedure with breakpoint and verification, and the task force final confirmation checklist."},"204":{"t":"Quality Control","o":"Use the basic statistical tools to understand and control a process: stratification, Pareto, cause analysis, histogram, capability and control charts.","m":["Quality and the customer","Assurance and control","Data and variation","Stratification, check sheets and Pareto","Cause analysis","Histogram","Process capability","Control charts"],"b":"Quality decisions based on data, fewer defects by attacking the main causes and process capability demonstrated to the customer.","e":"A Pareto, a histogram, a capability study and a control chart built with data from your own plant."},"205":{"t":"Torque and Bolted Joint Control","o":"Understand how a bolted joint behaves, specify and classify joints, choose the right tightening tool and audit torque on the line.","m":["Why a bolt is tightened","The joint","Specifying and classifying","Tightening tools","Measuring and auditing torque","The station and the workshop"],"b":"Fewer field failures and claims from loose joints, the right tool for each joint and torque audits that catch deviations in time.","e":"Your plant joints classified, the right tool for each one and an analyzed torque audit."},"206":{"t":"Supervisor Role on the Floor","o":"Organize the supervisor work around three responsibilities: meeting targets, standardizing and improving the work, and developing people.","m":["The supervisor role","Meeting the targets","Standardizing and improving","Developing people","The supervisor control cycle"],"b":"Shifts that meet their targets consistently, supervisors who control their area instead of fighting fires, and better-prepared staff.","e":"The 20 supervisor control points organized into a daily, weekly and monthly routine."},"207":{"t":"Standard Operation and On-the-Job Instruction","o":"Analyze an operation, write its standard sheet, allocate and balance the work, and teach it so any operator does it the same way.","m":["The standard operation","Analyzing and improving the method","Steps, key points and reasons","Sheet types and the standards binder","Work allocation and balancing","Man-machine combination","On-the-job instruction","Maintaining and improving the standard"],"b":"The same quality and productivity on every shift, shorter training and a standard that serves as the baseline for improvement.","e":"The analysis, allocation and combination sheets for a real operation, and instruction practiced in 4 steps."},"208":{"t":"8D Problem Solving","o":"Resolve a customer complaint with the 8D method: contain, find and confirm the root cause, correct it and prevent recurrence.","m":["The method: 8D and QC Story","D0 to D2: prepare, team and describe","D3: containment","D4: root cause","D5 and D6: actions and validation","D7 and D8: prevent and close"],"b":"Complaints closed on time and with evidence, fewer problems that come back and a better rating with the customer.","e":"A complete 8D for a case, from D0 to D8, and a checklist to evaluate the 8Ds in your plant."},"209":{"t":"Taguchi Method: robust processes","o":"Design and analyze experiments with orthogonal arrays and signal-to-noise ratio, so a process gives the same result even when weather, material or wear change.","m":["Background and robustness","Function, noise and control","Signal-to-noise ratio","Orthogonal arrays","The 5 phases and 9 steps","The L18 helicopter experiment","Dynamic characteristics","The catapult and target shooting"],"b":"Processes that produce right the first time with fewer adjustments, less waste from variation and improvements achieved without investing in new equipment.","e":"Two complete experiments run by the participants and an experiment plan for a process in your plant."},"210":{"t":"Floor Trainer: the 3-step method","o":"Prepare and deliver on-the-job training with the 3-step method (explain, demonstrate and verify) and release the operator against clear criteria.","m":["The floor trainer","Preparing the training","Step 1: explain","Step 2: demonstrate and have them do it","Step 3: verify and follow up","Release and certify"],"b":"New operators productive from the first week, fewer defects caused by new staff and the same training regardless of who delivers it.","e":"A training plan, an operation taught in 3 steps and the trainer evaluation with mandatory criteria."},"211":{"t":"5S: a workstation where the abnormal is visible","o":"Apply 5S on a real workstation: sort, set in order, shine, standardize and sustain with audits.","m":["Why 5S","Sort","Set in order","Shine","Standardize","Sustain and evaluate"],"b":"Less time lost searching, errors and safety risks visible at a glance, and areas ready for the customer visit.","e":"The reference state of a workstation, its evaluation against 12 criteria and an audit checklist with finding follow-up."},"212":{"t":"TPM: equipment that does not fail from neglect","o":"Calculate OEE with its 6 big losses and start autonomous maintenance, from step 0 to 3, on a real piece of equipment.","m":["What TPM is","OEE and the 6 big losses","Autonomous maintenance: the 7 steps","Steps 0 and 1: know and clean","Step 2: attack the source","Step 3: the standard","Evaluating progress by step"],"b":"Fewer stoppages from neglect, operators who spot failures before they happen and maintenance focused on what really belongs to it.","e":"OEE with its 6 losses, an anomaly log, an autonomous maintenance standard and the evaluation of the step reached."},"213":{"t":"FAST: from the help call to the root cause","o":"Respond to problems in two cycles: in minutes on the line, with the help call, and every day in the meeting, with the Find, Act, Solve, Track method.","m":["Why respond fast","F · Find: detect and call","A · Act: contain in 24 h","S · Solve: the cause with facts","T · Track: the daily meeting","The one-page FAST report","Evaluating the system"],"b":"Problems contained in hours rather than days, fewer defects reaching the customer and a daily meeting that actually closes problems.","e":"The help call criteria, a containment plan, the one-page FAST report and a daily meeting with its indicators."},"214":{"t":"Operations Observation: reality against the standard","o":"Plan and carry out operation observations to confirm work is done as the standard says, and turn every gap into an improvement with the operator.","m":["Why observe","Planning: the program","The 6 phases and preparation","From a distance and with a stopwatch","Up close: key points and parts","Improving and closing with the operator","Follow-up and coaching"],"b":"Standards that are met in practice, deviations caught before they cause defects and supervisors who coach on the floor.","e":"A monthly observation program, the 6-step observation sheet, an action plan and the evaluation for coaching."},"301":{"t":"Standard Time and Productivity: measure to decide","o":"Measure work with a stopwatch, calculate standard time and use it to decide takt, capacity, staffing and indicators.","m":["Productivity: what we measure and why","Standard time: what it is and how it is built","The stopwatch time study","Reading variation: cyclic and non-cyclic","Takt, efficiency and capacity","Staffing calculation","Productivity indicators and board"],"b":"Headcount calculated with data instead of habit, real capacity known before accepting an order and lost hours visible on the board.","e":"A complete time study, the staffing calculation and the hours cascade for your area."},"302":{"t":"Value Added: from the whole process to the motion","o":"Separate what adds value from what does not across the whole flow: in the process, the operation, the equipment, the space and logistics.","m":["What value added is","Seeing waste: the walk","Eagle view: the whole process","Insect view: the operation under a magnifier","Value added of equipment and space","Value added in logistics","From waste to improvement: owners and priorities"],"b":"Shorter lead time, less hidden cost in transport, waiting and motion, and a list of improvements with owners.","e":"The lead time of a flow, the value-added percentage of an operation and the waste list with owners."},"303":{"t":"Process Improvement and Line Balancing","o":"Remove waste from the process and the station, and balance the line to takt respecting precedences, with several models and volumes.","m":["Improving the process: ECRS","From islands to U-cells","Motion economy","Walking and the man-machine cycle","Material to the line","Balancing: the numbers","Precedences and positional weight","Layout principles","Several models and volumes","Implementing and sustaining"],"b":"The same volume with fewer operators, lines that meet takt and a configuration ready for every change in demand.","e":"A balance with precedences and layout principles, the scenario for each volume and the implementation plan."},"304":{"t":"Flow and Synchronized Production (JIT)","o":"Move from batch production to flow: pull with kanban, synchronize supply, draw the value stream map and reduce changeovers.","m":["Why JIT","Seeing with flow eyes","Batch versus flow","Tightening the process: field practice","Pull: kanban","Cyclic supply and synchronization","Value stream map","Quick changeovers and small lots"],"b":"Less inventory and fewer days of lead time, defects caught at the next part instead of the next lot, and more flexibility to change models.","e":"A calculated kanban loop, the current and future value stream map, and a reduced changeover."},"305":{"t":"Blitz Kaizen: improving a station in 2 days","o":"Lead a two-day improvement event on a critical station: prepare, measure, analyze, change, test, report and sustain the result.","m":["What kaizen is","The Blitz Kaizen method","Finding the waste","Analyzing the current situation","Proposing countermeasures","Test, measure and adjust","Results and report","Sustaining the improvement"],"b":"Measurable results on a critical station in only two days, with little or no investment, and improvements sustained by standard and follow-up.","e":"A complete Blitz Kaizen with its one-page report, the 30, 60 and 90-day follow-up plan and the calendar to prepare the next event."},"01":{"t":"Goals and Time Management","o":"Set measurable goals, break them into tasks with an owner and a date, and protect in the calendar the time those goals need.","m":["Goals that get met: cascade, priority and SMART","From goal to result: tasks, obstacles and owners","Where does my time go? Time wasters and multitasking","Priorities and calendar: saying no and delegating"],"b":"Area goals that move forward every week, fewer last-minute emergencies and supervisors who spend their time on what moves the indicators.","e":"Cascaded goals with their plan and owner, and a weekly calendar with protected time blocks."},"02":{"t":"High-Impact Meetings","o":"Prepare and present a clear message, handle hard questions and run meetings that end with agreements, owners and dates.","m":["Prepare your message: objective, audience and clear slides","Present it with impact: voice, stories and questions","Meetings that work: purpose, formats and roles","Run the meeting: rules, difficult behaviors and minutes"],"b":"Shorter meetings that decide, fewer topics coming back every week and presentations management understands the first time.","e":"A message summarized in one sentence, slides that work without explanation and minutes with what, who and when."},"03":{"t":"Feedback and Conflict Management","o":"Give and receive feedback with a structured model, recognize your own conflict style and mediate to an agreement with a plan.","m":["Giving feedback: the SBI model and floor scenes","Receiving and asking for feedback, upward too","Understanding conflict: perceptions, interests and your style","Resolve and create value: mediate and agree on a plan"],"b":"Performance issues addressed in time, fewer conflicts that stop the line and a work environment that keeps good people.","e":"Feedback prepared with situation, behavior and impact; your conflict style and an agreed change plan."},"04":{"t":"High-Performance Teams","o":"Define the indicators that matter, read the board to act in time and develop every team member through instruction, coaching and delegation.","m":["Measure what matters: from objective to metric","Read the board and act: signal, noise and traps","Teach the work: skills matrix and instruction","Grow your team: styles, coaching and delegation"],"b":"Gaps caught before they become problems, staff able to cover several positions and a team that depends less on the supervisor.","e":"A board with useful indicators, a skills matrix, a work instruction and a development plan using the GROW model."},"05":{"t":"High-Impact Decisions","o":"Find the real cause of a problem, generate alternatives and choose with weighted criteria, individually or as a team.","m":["Find the cause: 5 whys and Ishikawa","Open the options: from 2 ideas to 30","Choose with method: criteria, matrix and traps","Decide as a team, communicate and review"],"b":"Decisions that solve the problem the first time, fewer agreements that get redone and decisions that can be explained and defended to management.","e":"A five-step decision path, a weighting matrix and a communicated decision, with a date to review whether it worked."},"06":{"t":"Improvement Projects: Justification and Deployment","o":"Choose the highest-impact improvement, justify it with financial analysis, win management approval and deploy it with measurable results.","m":["Find the improvement worth doing","Understand the process","Prioritize and learn from whoever does it best","Justify it with numbers","Get the yes","The investment committee","Build the project","Deploy and prove it"],"b":"Investments approved on solid arguments, projects finished on time and benefits verified, not just estimated.","e":"A one-page proposal with return on investment and a conservative scenario; the project charter, Gantt and change control; the verified benefit."},"07":{"t":"High-Value Professional","o":"Act with integrity in real dilemmas, speak up respectfully, measure internal customer satisfaction and build a career plan.","m":["Dilemmas on the plant floor","Speak up","Know your customer","Customer loyalty, in numbers","Know yourself","Your next step","Your relationships","Your plan"],"b":"Fewer hidden ethical and quality risks, better service between areas and talent that grows inside the company instead of leaving.","e":"A method to resolve dilemmas, a script for speaking up, an internal customer satisfaction survey and an 18-month career plan."}};
const WHY={es:{"soft":{"t":"En planta, a la gente se le promueve por lo técnico","a":"El mejor técnico se convierte en supervisor, pero nadie le enseña a dar retroalimentación, dirigir una junta, desarrollar a su gente ni justificar una inversión.","b":"Juntas sin acuerdos, decisiones que regresan, mejoras que no se aprueban, conflictos que frenan la línea y gente buena que se va."},"tech":{"t":"Las herramientas existen; lo que falta es el método en el piso","a":"Hay hojas de operación, 8D, cartas de control y auditorías 5S, pero se llenan para cumplir. El método depende de quién esté en el turno y se pierde cuando esa persona se va.","b":"Defectos que regresan, lanzamientos con sorpresas, estándares que nadie sigue, equipos que fallan por descuido y entrenamientos de “ve y fíjate”."},"ing":{"t":"Se mejora mucho; se mide y se sostiene poco","a":"El tiempo estándar se tomó hace años. Se balancea sin quitar antes el desperdicio. El inventario esconde los problemas. Las mejoras de un evento se pierden al mes.","b":"Líneas que no llegan al takt, operadores de apoyo permanentes, días de inventario entre procesos y mejoras que no se sostienen."}},en:{"soft":{"t":"In the plant, people get promoted for technical skill","a":"The best technician becomes a supervisor, but nobody teaches them to give feedback, run a meeting, develop their people or justify an investment.","b":"Meetings without agreements, decisions that come back, improvements that never get approved, conflicts that slow the line and good people who leave."},"tech":{"t":"The tools exist; what is missing is the method on the floor","a":"There are operation sheets, 8Ds, control charts and 5S audits, but they are filled in to comply. The method depends on who is on shift and is lost when that person leaves.","b":"Defects that come back, launches with surprises, standards nobody follows, equipment that fails from neglect and “go and watch” training."},"ing":{"t":"Plenty gets improved; little gets measured and sustained","a":"Standard time was taken years ago. Lines are balanced before waste is removed. Inventory hides the problems. Event improvements are lost within a month.","b":"Lines that do not reach takt, permanent support operators, days of inventory between processes and improvements that do not last."}}};

    return /^es/i.test(n)?'es':'en';
  });
  const t=T[lang];
  return (
    <div style={{background:'white'}}>
      <Nav lang={lang} setLang={setLang} t={t}/>
      <Hero t={t}/>
      <Gains t={t}/>
      <Catalog t={t} lang={lang}/>
      <Routes t={t} lang={lang}/>
      <How t={t}/>
      <CTA t={t}/>
      <footer style={{padding:'32px 56px',background:'#06142E',color:'#7B8AA8',fontSize:13,textAlign:'center'}}>
        <div style={{marginBottom:10}}>{t.foot}</div>
        <div>© 2026 IxT-QMS. {t.rights}. <a href="Aviso de Privacidad.html" style={{color:'#9FB4D6'}}>{t.priv}</a></div>
      </footer>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
setTimeout(()=>{
  let seen=false;
  try{seen=sessionStorage.getItem('ixSeenForm')==='1';sessionStorage.setItem('ixSeenForm','1');}catch(e){}
  if(seen||location.hash) return;
  const targets=[];
  document.querySelectorAll('#root section').forEach((sec)=>{
    const inner=sec.firstElementChild; if(!inner) return;
    Array.from(inner.children).forEach((ch)=>{ if(ch.dataset.noreveal) return; ch.classList.add('ixr'); targets.push(ch); });
  });
  const obs=new IntersectionObserver((es)=>es.forEach((e)=>{if(e.isIntersecting){e.target.classList.add('on');obs.unobserve(e.target);}}),{threshold:0.06,rootMargin:'0px 0px -6% 0px'});
  targets.forEach((x)=>obs.observe(x));
},60);
</script>
